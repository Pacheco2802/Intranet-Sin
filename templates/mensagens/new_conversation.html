{% extends "base.html" %}
{% block title %}Nova Conversa{% endblock %}
{% block page_title %}Nova Conversa{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto card">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Participantes</label>
      {{ form.participants }}
    </div>
    <div x-data="{ group: false }">
      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
        <input type="checkbox" name="is_group" x-model="group" class="rounded">
        Conversa em grupo
      </label>
      <div x-show="group" x-cloak class="mt-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome do grupo</label>
        {{ form.name }}
      </div>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Iniciar conversa</button>
      <a href="{% url 'mensagens:inbox' %}" class="btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
