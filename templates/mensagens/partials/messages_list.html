{% for msg in messages_qs %}
<div class="flex {% if msg.sender == request.user %}justify-end{% else %}justify-start{% endif %} mb-3">
  <div class="max-w-xs lg:max-w-md {% if msg.sender == request.user %}bg-primary text-white{% else %}bg-white border border-gray-100{% endif %} rounded-2xl px-4 py-2.5 shadow-sm">
    {% if msg.sender != request.user %}
    <p class="text-xs font-semibold text-primary mb-1">{{ msg.sender }}</p>
    {% endif %}
    <p class="text-sm leading-relaxed {% if msg.sender == request.user %}text-white{% else %}text-gray-800{% endif %}">{{ msg.content }}</p>
    <p class="text-xs {% if msg.sender == request.user %}text-blue-200{% else %}text-gray-400{% endif %} mt-1 text-right">{{ msg.sent_at|date:"H:i" }}</p>
  </div>
</div>
{% empty %}
<div class="text-center text-gray-400 text-sm py-8">Nenhuma mensagem ainda. Seja o primeiro a escrever!</div>
{% endfor %}
