{% if unread_messages_count > 0 %}
<script>
  (function(){
    var el = document.getElementById('rail-chat-badge');
    if (!el) return;
    var span = el.querySelector('span');
    if (!span) {
      span = document.createElement('span');
      span.className = 'absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[9px] font-bold rounded-full min-w-[16px] h-4 flex items-center justify-center px-0.5 leading-none';
      el.appendChild(span);
    }
    span.textContent = '{{ unread_messages_count }}';
  })();
</script>
{% else %}
<script>
  (function(){
    var el = document.getElementById('rail-chat-badge');
    if (el) { var s = el.querySelector('span'); if (s) s.remove(); }
  })();
</script>
{% endif %}
<a href="{% url 'core:notification_list' %}"
   class="relative p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors"
   title="Notificações">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
  </svg>
  {% if notification_count > 0 %}
  <span class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[9px] font-bold rounded-full min-w-[15px] h-[15px] flex items-center justify-center px-0.5 leading-none border border-white">{{ notification_count }}</span>
  {% endif %}
</a>

<a href="{% url 'mensagens:inbox' %}"
   class="relative p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors"
   title="Mensagens">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
  {% if unread_messages_count > 0 %}
  <span class="absolute top-0.5 right-0.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
  {% endif %}
</a>
