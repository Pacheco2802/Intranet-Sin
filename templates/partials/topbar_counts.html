{% comment %}
Carrier invisível — roda no carregamento inicial e a cada swap HTMX (30s).
Atualiza os badges (rail chat + sino + mensagens) e dispara o evento
'notif-update' consumido pelo componente Alpine notifBell() no base.html.
{% endcomment %}
<script>
(function () {
  var data = {
    notif: {{ notification_count|default:0 }},
    unread: {{ unread_messages_count|default:0 }},
    latestId: {{ latest_id|default:0 }},
    title: "{{ latest_title|escapejs }}",
    body: "{{ latest_body|escapejs }}",
    link: "{{ latest_link|escapejs }}"
  };
  window.__notif = data;

  // Badge no ícone de chat do rail lateral
  var rb = document.getElementById('rail-chat-badge');
  if (rb) {
    var s = rb.querySelector('span');
    if (data.unread > 0) {
      if (!s) {
        s = document.createElement('span');
        s.className = 'absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[9px] font-bold rounded-full min-w-[16px] h-4 flex items-center justify-center px-0.5 leading-none';
        rb.appendChild(s);
      }
      s.textContent = data.unread;
    } else if (s) { s.remove(); }
  }

  // Bolinha de mensagens não lidas no topbar
  var dot = document.getElementById('topbar-msg-dot');
  if (dot) dot.classList.toggle('hidden', !(data.unread > 0));

  // Notifica o componente do sino (Alpine)
  window.dispatchEvent(new CustomEvent('notif-update', { detail: data }));
})();
</script>
